<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papa Stud</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f5f0;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-dim: #6b6b6b;
      --accent: #2563eb;
      --accent-light: #dbeafe;
      --border: #e5e5e0;
      --radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header .tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-light);
      padding: 2px 8px;
      border-radius: 99px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px;
      text-align: center;
      max-width: 480px;
    }

    .card h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>Papa Stud</h1>
    <span class="tag">paparazzi</span>
  </header>
  <main>
    <div class="card">
      <h2>Hello, World</h2>
      <p>Paparazzi screenshot viewer — ready to go.</p>
    </div>
  </main>
</body>
</html>
