name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-checks:
    name: Node.js
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Check JS syntax (backend)
        run: |
          for f in src/*.js; do
            node --check "$f"
          done

      - name: Check JS syntax (frontend)
        run: |
          for f in static/js/*.js; do
            node --check "$f"
          done

      - name: Run unit tests
        run: npm test

  screenshot-tests:
    name: Screenshot Tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: papastudio-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run screenshot tests
        run: |
          docker run --rm \
            -e CI=true \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            papastudio-test \
            npx playwright test --reporter=list,html

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Post failure summary on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsDir = 'test-results';
            let failures = [];
            if (fs.existsSync(resultsDir)) {
              const dirs = fs.readdirSync(resultsDir).filter(d =>
                fs.statSync(path.join(resultsDir, d)).isDirectory()
              );
              for (const dir of dirs) {
                const files = fs.readdirSync(path.join(resultsDir, dir));
                if (files.some(f => f.endsWith('-diff.png') || f === 'error-context.md')) {
                  const name = dir.replace(/^hello-/, '').replace(/-/g, ' ');
                  failures.push(name);
                }
              }
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = `## Screenshot Tests Failed\n\n`;
            body += `**${failures.length} test(s) failed:**\n\n`;
            for (const f of failures) {
              body += `- ${f}\n`;
            }
            body += `\nDownload the diff images and HTML report from the [workflow artifacts](${runUrl}).\n`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
