name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set version in package.json
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Package for ${{ matrix.arch }}
        run: npx electron-forge make --arch=${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: papastud-${{ matrix.arch }}
          path: |
            out/make/**/*.zip
            out/make/**/*.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: papastud-arm64
          path: artifacts/arm64

      - name: Download x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: papastud-x64
          path: artifacts/x64

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          find artifacts -name "*.dmg" -exec cp {} release/ \;
          ls -la release/

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: papastud-arm64
          path: artifacts/arm64

      - name: Download x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: papastud-x64
          path: artifacts/x64

      - name: Compute SHA256
        id: sha
        run: |
          ARM64_ZIP=$(find artifacts/arm64 -name "*.zip" | head -1)
          X64_ZIP=$(find artifacts/x64 -name "*.zip" | head -1)
          echo "arm64_sha=$(sha256sum $ARM64_ZIP | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x64_sha=$(sha256sum $X64_ZIP | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update Homebrew cask
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: eboudrant/homebrew-tap
          event-type: update-cask
          client-payload: |
            {
              "version": "${{ inputs.version }}",
              "arm64_sha": "${{ steps.sha.outputs.arm64_sha }}",
              "x64_sha": "${{ steps.sha.outputs.x64_sha }}"
            }
