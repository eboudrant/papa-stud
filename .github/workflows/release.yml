name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Package for ${{ matrix.arch }}
        run: npx electron-forge make --arch=${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: papastud-${{ matrix.arch }}
          path: |
            out/make/**/*.zip
            out/make/**/*.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: papastud-arm64
          path: artifacts/arm64

      - name: Download x64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: papastud-x64
          path: artifacts/x64

      - name: Collect release files
        id: collect
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          find artifacts -name "*.dmg" -exec cp {} release/ \;
          ls -la release/
          # Compute SHA256 for Homebrew
          cd release
          for f in *.zip; do
            sha256sum "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: papastud-arm64
          path: artifacts/arm64

      - name: Download x64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: papastud-x64
          path: artifacts/x64

      - name: Compute SHA256
        id: sha
        run: |
          ARM64_ZIP=$(find artifacts/arm64 -name "*.zip" | head -1)
          X64_ZIP=$(find artifacts/x64 -name "*.zip" | head -1)
          echo "arm64_sha=$(sha256sum $ARM64_ZIP | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x64_sha=$(sha256sum $X64_ZIP | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "arm64_file=$(basename $ARM64_ZIP)" >> $GITHUB_OUTPUT
          echo "x64_file=$(basename $X64_ZIP)" >> $GITHUB_OUTPUT

      - name: Update Homebrew cask
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: eboudrant/homebrew-tap
          event-type: update-cask
          client-payload: |
            {
              "version": "${{ steps.version.outputs.version }}",
              "arm64_sha": "${{ steps.sha.outputs.arm64_sha }}",
              "x64_sha": "${{ steps.sha.outputs.x64_sha }}",
              "arm64_file": "${{ steps.sha.outputs.arm64_file }}",
              "x64_file": "${{ steps.sha.outputs.x64_file }}"
            }
