name: Bug report
description: Something broken or behaving unexpectedly in Papa Stud.io
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Steps to reproduce and any logs are welcome.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Papa Stud.io version, macOS version, screenshot tool.
      placeholder: Papa Stud.io 1.2.3 — macOS 14.5 — Paparazzi
    validations:
      required: false
